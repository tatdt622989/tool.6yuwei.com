# Locale-specific 404 pages (built at /en/404/index.html, /ja/404/index.html); zh-TW uses /404.html.
map $uri $not_found_page {
    ~^/en/  /en/404/index.html;
    ~^/ja/  /ja/404/index.html;
    default /404.html;
}

# Short links read out in YouTube Shorts (viewers cannot click links there, so they type these).
# Each one carries UTM tags so GA4 shows which video sent the visit. 302, so a code can be pointed elsewhere later.
map $uri $short_link {
    default "";
    ~*^/house/?$      "/mortgage-calculator/?utm_source=youtube&utm_medium=shorts&utm_campaign=house";
    ~*^/japan/?$      "/japan-tax-refund/?utm_source=youtube&utm_medium=shorts&utm_campaign=japan";
    ~*^/tax/?$        "/income-tax-calculator/?utm_source=youtube&utm_medium=shorts&utm_campaign=tax";
    ~*^/kuji/?$       "/ichiban-kuji/?utm_source=youtube&utm_medium=shorts&utm_campaign=kuji";
    ~*^/power/?$      "/electricity-bill/?utm_source=youtube&utm_medium=shorts&utm_campaign=power";
    ~*^/stock/?$      "/position-size-calculator/?utm_source=youtube&utm_medium=shorts&utm_campaign=stock";
    ~*^/retire/?$     "/labor-pension/?utm_source=youtube&utm_medium=shorts&utm_campaign=retire";
    ~*^/age/?$        "/age-calculator/?utm_source=youtube&utm_medium=shorts&utm_campaign=age";
    ~*^/2027/?$       "/holidays-2027/?utm_source=youtube&utm_medium=shorts&utm_campaign=2027";
    ~*^/coffee/?$     "/work-hours-cost/?utm_source=youtube&utm_medium=shorts&utm_campaign=coffee";
    ~*^/sale/?$       "/discount-calculator/?utm_source=youtube&utm_medium=shorts&utm_campaign=sale";
    ~*^/invoice/?$    "/invoice-lottery/?utm_source=youtube&utm_medium=shorts&utm_campaign=invoice";
    ~*^/ja/kuji/?$    "/ja/ichiban-kuji/?utm_source=youtube&utm_medium=shorts&utm_campaign=ja-kuji";
    ~*^/ja/school/?$  "/ja/school-year-calculator/?utm_source=youtube&utm_medium=shorts&utm_campaign=ja-school";
    ~*^/ja/gw/?$      "/ja/japan-holidays-2027/?utm_source=youtube&utm_medium=shorts&utm_campaign=ja-gw";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind Coolify's proxy: keep redirects relative so they stay on https://tool.6yuwei.com
    absolute_redirect off;
    server_tokens off;

    if ($short_link) {
        return 302 $short_link;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml application/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Fingerprinted build assets never change.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location = /ads.txt { default_type text/plain; try_files $uri =404; }
    location = /robots.txt { default_type text/plain; try_files $uri =404; }
    location ~ ^/(?:en/|ja/)?tools\.json$ {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # The conversion index moved into the 單位換算 category page.
    location ~ ^/convert/?$ {
        return 301 /category/convert/;
    }

    # HTML: always revalidate so new deploys show up immediately.
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ =404;
    }

    error_page 404 $not_found_page;
}
