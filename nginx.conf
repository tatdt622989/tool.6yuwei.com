server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind Coolify's proxy: keep redirects relative so they stay on https://tool.6yuwei.com
    absolute_redirect off;
    server_tokens off;

    if ($short_link) {
        return 302 $short_link;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml application/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Fingerprinted build assets never change.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;

        # nginx's mime.types has no .mjs entry, so the PDF.js worker was sent as
        # application/octet-stream and browsers (with nosniff) refused to run it.
        location ~ \.mjs$ {
            types { }
            default_type text/javascript;
            try_files $uri =404;
        }
    }

    location ~* \.(png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location = /ads.txt { default_type text/plain; try_files $uri =404; }
    location = /robots.txt { default_type text/plain; try_files $uri =404; }
    location ~ ^/(?:en/|ja/)?tools\.json$ {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # The conversion index moved into the 單位換算 category page.
    location ~ ^/convert/?$ {
        return 301 /category/convert/;
    }

    # HTML: always revalidate so new deploys show up immediately.
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ =404;
    }

    error_page 404 $not_found_page;
}
