# Weekly dependency updates. Minor and patch bumps are grouped into one PR to keep the noise down;
# major versions still get their own PR. CI runs on every Dependabot PR before it can be merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Taipei
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
