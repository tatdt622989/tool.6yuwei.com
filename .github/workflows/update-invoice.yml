# Refresh 統一發票中獎號碼 (src/tools/invoice-lottery/data.json) after each draw.
# Draws are on the 25th of odd months (Asia/Taipei). 11:00 UTC = 19:00 Taipei; the 26th/27th runs are retries.
# A push to main triggers the Coolify auto-deploy.
name: Update invoice numbers

on:
  schedule:
    - cron: '0 11 25-27 1,3,5,7,9,11 *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-invoice
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Fetch latest winning numbers
        run: node scripts/update-invoice.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- src/tools/invoice-lottery/data.json; then
            echo "No new period."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/tools/invoice-lottery/data.json
          git commit -m "chore(invoice): update 統一發票中獎號碼"
          git push origin HEAD:main
